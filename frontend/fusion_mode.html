<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZOPH · Fusion Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#0a0a0a; --card:#121212; --card2:#171717; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --txt:#f2f2f2; --dim:#8d8d8d; --faint:#5b5b5b; --red:#E84045; --red-soft:rgba(232,64,69,.14);
  --green:#35c77b; --amber:#f5b942;
  --sans:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Space Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:clamp(11px,1.5vh,15px)}
body::before{ /* dithered red haze, echoing the halftone art on wafer.ai, in our palette */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(232,64,69,.30) 1px,transparent 1.3px);background-size:7px 7px;
  -webkit-mask-image:radial-gradient(120% 70% at 85% 110%,#000 0%,transparent 62%);mask-image:radial-gradient(120% 70% at 85% 110%,#000 0%,transparent 62%);opacity:.55}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(180deg,transparent 55%,rgba(232,64,69,.07))}
#app{position:relative;z-index:1;display:grid;grid-template-columns:clamp(200px,16vw,250px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh}
.mono{font-family:var(--mono)}
/* top bar */
.top{grid-column:1/3;display:flex;align-items:center;gap:1.2em;padding:.7em 1.4em;border-bottom:1px solid var(--line);background:rgba(10,10,10,.8);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:.55em;font-weight:600;letter-spacing:.04em;font-size:1.25em}
.brand .slash{color:var(--red);font-weight:300;font-size:1.3em}
.brand small{font-family:var(--mono);font-weight:400;font-size:.55em;color:var(--dim);letter-spacing:.18em}
.sid{margin:0 auto;font-family:var(--mono);font-size:.82em;color:var(--dim);letter-spacing:.06em;padding:.35em .9em;border:1px solid var(--line);border-radius:99px}
.sid b{color:var(--txt);font-weight:400}
.eb{display:inline-flex;align-items:center;gap:.5em;font-family:var(--mono);font-size:.68em;letter-spacing:.14em;text-transform:uppercase;padding:.35em .85em;border:1px solid var(--line2);border-radius:99px;color:var(--dim);white-space:nowrap}
.eb::before{content:"";width:.55em;height:.55em;border-radius:50%;background:var(--faint)}
.eb.green{color:var(--green);border-color:rgba(53,199,123,.35)}.eb.green::before{background:var(--green)}
.eb.amber{color:var(--amber);border-color:rgba(245,185,66,.4)}.eb.amber::before{background:var(--amber)}
.eb.red{color:var(--red);border-color:rgba(232,64,69,.4)}.eb.red::before{background:var(--red)}
.btn{font-family:var(--mono);font-size:.74em;letter-spacing:.12em;text-transform:uppercase;color:var(--txt);background:transparent;border:1px solid var(--line2);border-radius:99px;padding:.55em 1.1em;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.solid{background:var(--red);border-color:var(--red);color:#fff}.btn.solid:hover{filter:brightness(1.1);color:#fff}
/* rail */
.rail{display:flex;flex-direction:column;gap:.6em;padding:1em .9em;border-right:1px solid var(--line);min-height:0;background:rgba(10,10,10,.55)}
.nav{display:flex;flex-direction:column;gap:.3em}
.nav button{display:grid;grid-template-columns:2.2em 1fr;align-items:center;text-align:left;gap:.2em;color:var(--dim);background:transparent;border:1px solid transparent;border-radius:12px;padding:.6em .7em;cursor:pointer;font-family:var(--sans);font-size:1em;transition:.15s}
.nav button i{font-style:normal;font-family:var(--mono);font-size:.78em;color:var(--faint)}
.nav button span{font-weight:500;color:var(--txt)}
.nav button em{grid-column:2;font-style:normal;font-size:.76em;color:var(--faint);margin-top:.1em}
.nav button:hover{border-color:var(--line)}
.nav button.on{background:var(--red-soft);border-color:rgba(232,64,69,.45)}
.nav button.on i{color:var(--red)}
.rail h6{font-family:var(--mono);font-weight:400;font-size:.66em;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-top:.5em}
.chips{display:flex;gap:.4em;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:.78em;color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.45em .75em;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--line2);color:var(--txt)}
.chip.on{color:#fff;background:var(--red-soft);border-color:var(--red)}
.chip.dis{opacity:.35;cursor:not-allowed}
.fixed{font-family:var(--mono);font-size:.7em;color:var(--faint);line-height:1.7}
.fixed b{color:var(--dim);font-weight:400}
.spacer{flex:1}
/* stage */
#stage{min-width:0;min-height:0;padding:1.1em 1.4em;display:flex;flex-direction:column;gap:.9em;overflow:hidden}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:1em;flex:none}
.head .eyebrow{display:inline-flex;align-items:center;gap:.55em;font-family:var(--mono);font-size:.68em;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.head .eyebrow::before{content:"";width:.5em;height:.5em;border-radius:50%;background:var(--red);box-shadow:0 0 .8em var(--red)}
.head h1{font-weight:300;font-size:1.9em;letter-spacing:-.01em;line-height:1.1;margin-top:.15em}
.head h1 b{font-weight:500}
.body{flex:1;min-height:0;display:grid;gap:.9em}
.card{position:relative;min-width:0;min-height:0;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--card);border:1px solid var(--line);border-radius:16px;padding:.9em 1.05em;display:flex;flex-direction:column;overflow:hidden}
.card>h3{flex:none;display:flex;align-items:center;justify-content:space-between;gap:.6em;font-family:var(--mono);font-weight:400;font-size:.68em;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:.6em}
.card .fill{flex:1;min-height:0;position:relative}
canvas{display:block;width:100%;height:100%}
.stat .v{font-weight:300;font-size:2.35em;line-height:1;letter-spacing:-.02em;margin-top:.15em}
.stat .v small{font-family:var(--mono);font-size:.3em;letter-spacing:.1em;color:var(--dim);margin-left:.4em;text-transform:uppercase}
.stat .s{font-family:var(--mono);font-size:.68em;color:var(--dim);margin-top:.7em;letter-spacing:.04em}
.stat.good .v{color:var(--green)}.stat.bad .v{color:var(--red)}.stat.warn .v{color:var(--amber)}
.tag{display:inline-block;font-family:var(--mono);font-size:.66em;letter-spacing:.1em;padding:.25em .6em;border-radius:6px;border:1px solid var(--line2);color:var(--dim);text-transform:uppercase}
.tag.good{color:var(--green);border-color:rgba(53,199,123,.4)}.tag.bad{color:var(--red);border-color:rgba(232,64,69,.45)}.tag.warn{color:var(--amber);border-color:rgba(245,185,66,.45)}
table{width:100%;border-collapse:collapse;font-size:.92em}
th{font-family:var(--mono);font-weight:400;font-size:.68em;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;text-align:right;padding:.35em .4em;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:.5em .4em;border-bottom:1px solid rgba(255,255,255,.04);text-align:right;font-family:var(--mono);font-size:.9em;color:var(--txt)}
td:first-child{font-family:var(--sans);color:var(--dim)}
tr:last-child td{border-bottom:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.45em 1em;font-size:.95em;align-content:start}
.kv dt{color:var(--dim)}.kv dd{text-align:right;font-family:var(--mono);color:var(--txt)}
.legend{display:flex;gap:.45em;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:.5em;font-family:var(--mono);font-size:.7em;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:99px;padding:.3em .8em;cursor:pointer}
.lg i{width:.9em;height:.25em;border-radius:2px;background:var(--c)}
.lg.off{opacity:.35}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;color:var(--faint);text-align:center;font-family:var(--mono);font-size:.82em;letter-spacing:.08em}
.empty b{color:var(--dim);font-weight:400;font-size:1.2em;letter-spacing:.2em;text-transform:uppercase}
.bar{height:.5em;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--red)}
.bar>i.g{background:var(--green)}
.list{list-style:none;display:flex;flex-direction:column;gap:.55em;font-size:.95em;color:var(--dim);line-height:1.35}
.list li{display:grid;grid-template-columns:1.6em 1fr;gap:.2em}
.list li::before{content:attr(data-n);font-family:var(--mono);font-size:.78em;color:var(--red);padding-top:.15em}
.list li b{color:var(--txt);font-weight:500}
.form{display:grid;grid-template-columns:1fr 1fr;gap:.5em .6em;align-content:start}
.form label{display:flex;flex-direction:column;gap:.25em;font-family:var(--mono);font-size:.62em;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.form input,.form select{font-family:var(--mono);font-size:1.45em;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:.35em .55em;width:100%;outline:none}
.form input:focus,.form select:focus{border-color:var(--red)}
.form .wide{grid-column:1/3}
.msg{font-family:var(--mono);font-size:.7em;color:var(--dim);min-height:1.3em}
.msg.err{color:var(--red)}
.opt{display:grid;grid-template-columns:5.2em 1fr 9em;align-items:center;gap:.8em;padding:.5em 0;border-bottom:1px solid rgba(255,255,255,.04)}
.opt:last-child{border-bottom:0}
.opt .nm{font-family:var(--mono);font-size:.85em;color:var(--txt)}
.opt .nm small{display:block;color:var(--faint);font-size:.8em}
.track{position:relative;height:1.7em}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line2)}
.track .w{position:absolute;top:50%;height:.5em;margin-top:-.25em;border-radius:99px;background:rgba(232,64,69,.35)}
.track .d{position:absolute;top:50%;width:.9em;height:.9em;margin:-.45em 0 0 -.45em;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(232,64,69,.25)}
.opt.rec .d{background:var(--green);box-shadow:0 0 0 3px rgba(53,199,123,.25)}
.opt.rec .w{background:rgba(53,199,123,.35)}
.opt .st{font-family:var(--mono);font-size:.72em;text-align:right;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="slash">/</span>ZOPH<small>FUSION MODE</small></div>
    <div class="sid" id="sid">no scenario</div>
    <span id="badge"></span>
    <button class="btn" id="refresh" title="Reload all files">Refresh</button>
    <button class="btn solid" id="exit">Exit Fusion Mode</button>
  </header>
  <aside class="rail">
    <nav class="nav" id="nav"></nav>
    <h6>Road class</h6><div class="chips" id="c-cls"></div>
    <h6>Damping c (N·s/m)</h6><div class="chips" id="c-c"></div>
    <h6>Sensor dropout (%)</h6><div class="chips" id="c-d"></div>
    <div class="spacer"></div>
    <div class="fixed" id="fixed"></div>
  </aside>
  <main id="stage"></main>
</div>

<script>
/* ================= config + state ================= */
const qs=new URLSearchParams(location.search);
const API=qs.get('api')!==null?qs.get('api'):((location.protocol==='file:'||location.port!=='8000')?'http://localhost:8000':'');
const PAGES=[
  ['overview','Overview','how much to trust it'],
  ['signals','Signals','raw vs fused, live run'],
  ['comfort','Comfort','prediction + interval'],
  ['validation','Validation','errors and detection'],
  ['envelope','Envelope & Damping','supported? best preset?'],
  ['model','Model & Limits','what this is not']
];
const CH={
  body_vel:{label:'Body vel',unit:'m/s',truth:'body_vel_mps',fused:'body_vel_mps'},
  road_height:{label:'Road height',unit:'mm',scale:1000,truth:'road_height_m',fused:'road_height_m'},
  susp_travel:{label:'Susp travel',unit:'mm',scale:1000,truth:'susp_travel_m',raw:'susp_travel_m',fused:'susp_travel_m'},
  wheel_vel:{label:'Wheel vel',unit:'m/s',truth:'wheel_vel_mps',fused:'wheel_vel_mps'},
  body_acc:{label:'Body acc',unit:'m/s²',truth:'body_acc_mps2',raw:'body_acc_mps2'},
  wheel_acc:{label:'Wheel acc',unit:'m/s²',raw:'wheel_acc_mps2'}
};
const S={page:'overview',ch:'susp_travel',summary:null,comfort:null,envelope:null,semi:null,meta:null,ids:[],parsed:[],
  sel:{cls:null,c:null,d:null},fixed:{v:20,m:440,s:0},ts:null,live:false,vis:{truth:true,raw:true,fused:true,band:true},
  liveMsg:'',liveForm:{road_class:'B',speed_mps:20,ms_kg:440,c_nsm:1800,dropout_pct:5,seed:1,duration_s:10}};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= data ================= */
async function G(path){try{const r=await fetch(API+path);if(!r.ok)return null;return await r.json();}catch(e){return null;}}
const ID_RE=/^r([A-D])_v(\d+)_m(\d+)_c(\d+)_d(\d+)_s(\d+)$/;
const parseId=id=>{const m=ID_RE.exec(id);return m?{id,cls:m[1],v:+m[2],m:+m[3],c:+m[4],d:+m[5],s:+m[6]}:null;};
const idOf=(cls,v,m,c,d,s)=>`r${cls}_v${v}_m${m}_c${c}_d${d}_s${s}`;
function curId(){const {cls,c,d}=S.sel;if(cls==null)return null;
  const hit=S.parsed.find(p=>p.cls===cls&&p.c===c&&p.d===d&&p.v===S.fixed.v&&p.m===S.fixed.m&&p.s===S.fixed.s)||S.parsed.find(p=>p.cls===cls&&p.c===c&&p.d===d);
  return hit?hit.id:null;}
async function loadTs(){const id=curId();S.live=false;S.ts=id?await G('/fusion/data/timeseries/'+id):null;}
async function loadAll(){
  const [summary,comfort,envelope,semi,meta,sc]=await Promise.all([
    G('/fusion/data/fusion_summary'),G('/fusion/data/comfort_predictions'),G('/fusion/data/envelope'),
    G('/fusion/data/semiactive_ranking'),G('/fusion/data/run_meta'),G('/fusion/scenarios')]);
  Object.assign(S,{summary,comfort,envelope,semi,meta});
  S.ids=(sc&&sc.timeseries)||[];S.parsed=S.ids.map(parseId).filter(Boolean);
  if(S.parsed.length){const f=S.parsed[0];S.fixed={v:f.v,m:f.m,s:f.s};
    if(!S.parsed.some(p=>p.cls===S.sel.cls&&p.c===S.sel.c&&p.d===S.sel.d)){const b=S.parsed.find(p=>p.cls==='B'&&p.c===1800&&p.d===5)||f;S.sel={cls:b.cls,c:b.c,d:b.d};}}
  await loadTs();renderAll();
}

/* ================= helpers ================= */
const fx=o=>!!(o&&((o.meta&&(o.meta.fixture||o.meta.mock))||o.fixture));
function badgeFor(objs){const p=objs.filter(Boolean);
  if(!p.length)return '<span class="eb">No data</span>';
  return p.some(fx)?'<span class="eb amber">Sample data</span>':'<span class="eb green">Live data</span>';}
const num=v=>typeof v==='number'&&isFinite(v);
const fmt=(v,sig=3)=>!num(v)?'–':(v===0?'0':String(Number(v.toPrecision(sig))));
const pct=(v,d=1)=>!num(v)?'–':(v*100).toFixed(d)+'%';
const mm=v=>num(v)?v*1000:null;
const pretty=k=>k.replace(/_/g,' ');
const empty=(t,h)=>`<div class="empty"><b>${t}</b><span>${h||''}</span></div>`;
const card=(title,body,cls='',style='',extra='')=>`<section class="card ${cls}" style="${style}"><h3><span>${title}</span>${extra}</h3>${body}</section>`;
const stat=(label,val,unit,sub,tone='')=>`<section class="card stat ${tone}"><h3><span>${label}</span></h3><div class="v">${val}<small>${unit||''}</small></div><div class="s">${sub||''}</div></section>`;
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
function head(n,title,right=''){return `<div class="head"><div><div class="eyebrow">${n} · ${esc(PAGES[+n-1][1])}</div><h1>${title}</h1></div><div>${right}</div></div>`;}

/* ================= canvas charts (no external libs) ================= */
const charts={};
function prep(cv){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(10,Math.round(r.width*d));cv.height=Math.max(10,Math.round(r.height*d));
  const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);return {g,w:r.width,h:r.height};}
function ticks(a,b,n=5){if(!(b>a)){b=a+1;}const raw=(b-a)/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p,s=(f<1.5?1:f<3?2:f<7?5:10)*p;
  const out=[];for(let v=Math.ceil(a/s)*s;v<=b+s*1e-6;v+=s)out.push(+v.toPrecision(12));return out;}
const tf=v=>{const a=Math.abs(v);return a===0?'0':(a>=1000||a<0.01)?v.toExponential(1):String(+v.toPrecision(3));};
function lineChart(id,o){
  const cv=document.getElementById(id);if(!cv)return;
  const X=o.x,ser=o.series.filter(s=>s&&s.y),m={l:58,r:12,t:8,b:30};
  const draw=(hi)=>{const {g,w,h}=prep(cv);g.clearRect(0,0,w,h);
    const pw=w-m.l-m.r,ph=h-m.t-m.b;let lo=Infinity,up=-Infinity;
    const scan=a=>a&&a.forEach(v=>{if(num(v)){if(v<lo)lo=v;if(v>up)up=v;}});
    ser.forEach(s=>scan(s.y));if(o.band){scan(o.band.lo);scan(o.band.hi);}
    if(!isFinite(lo)){lo=0;up=1;}const pad=(up-lo||1)*.06;lo-=pad;up+=pad;
    const x0=X[0],x1=X[X.length-1]||1,px=v=>m.l+(v-x0)/((x1-x0)||1)*pw,py=v=>m.t+(1-(v-lo)/(up-lo))*ph;
    g.font='10px "Space Mono",monospace';g.fillStyle='#6a6a6a';g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;
    ticks(lo,up,5).forEach(t=>{const y=py(t);g.beginPath();g.moveTo(m.l,y);g.lineTo(w-m.r,y);g.stroke();g.textAlign='right';g.textBaseline='middle';g.fillText(tf(t),m.l-8,y);});
    ticks(x0,x1,7).forEach(t=>{const x=px(t);g.beginPath();g.moveTo(x,m.t);g.lineTo(x,h-m.b);g.stroke();g.textAlign='center';g.textBaseline='top';g.fillText(tf(t),x,h-m.b+7);});
    g.fillStyle='#777';g.textAlign='right';g.textBaseline='bottom';g.fillText(o.xlab||'',w-m.r,h-1);
    g.save();g.translate(11,m.t+ph/2);g.rotate(-Math.PI/2);g.textAlign='center';g.textBaseline='top';g.fillText(o.ylab||'',0,0);g.restore();
    g.save();g.beginPath();g.rect(m.l,m.t,pw,ph);g.clip();
    if(o.band&&o.band.on){g.fillStyle='rgba(232,64,69,.20)';g.beginPath();let st=false;
      for(let i=0;i<X.length;i++){const v=o.band.hi[i];if(!num(v))continue;st?g.lineTo(px(X[i]),py(v)):(g.moveTo(px(X[i]),py(v)),st=true);}
      for(let i=X.length-1;i>=0;i--){const v=o.band.lo[i];if(num(v))g.lineTo(px(X[i]),py(v));}g.closePath();g.fill();}
    if(o.marks){const by=h-m.b;o.marks.forEach(k=>{g.fillStyle=k.color;for(let i=0;i<X.length;i++)if(k.a[i])g.fillRect(px(X[i])-.5,by-k.h-k.off,Math.max(1,pw/X.length),k.h);});}
    ser.forEach(s=>{if(s.hide)return;g.strokeStyle=s.color;g.lineWidth=s.w||1.4;g.globalAlpha=s.alpha||1;g.beginPath();let pen=false;
      for(let i=0;i<X.length;i++){const v=s.y[i];if(!num(v)){pen=false;continue;}pen?g.lineTo(px(X[i]),py(v)):(g.moveTo(px(X[i]),py(v)),pen=true);}g.stroke();g.globalAlpha=1;});
    g.restore();
    if(hi!=null&&hi>=0){const x=px(X[hi]);g.strokeStyle='rgba(255,255,255,.3)';g.beginPath();g.moveTo(x,m.t);g.lineTo(x,h-m.b);g.stroke();
      const lines=[`t = ${fmt(X[hi],4)}`].concat(ser.filter(s=>!s.hide).map(s=>`${s.label}: ${num(s.y[hi])?fmt(s.y[hi],3):'gap'}`));
      g.font='11px "Space Mono",monospace';const tw=Math.max(...lines.map(l=>g.measureText(l).width))+16,th=lines.length*15+10;
      let bx=x+12;if(bx+tw>w-m.r)bx=x-12-tw;g.fillStyle='rgba(20,20,20,.94)';g.strokeStyle='rgba(255,255,255,.18)';g.beginPath();g.roundRect?g.roundRect(bx,m.t+6,tw,th,6):g.rect(bx,m.t+6,tw,th);g.fill();g.stroke();
      g.textAlign='left';g.textBaseline='top';lines.forEach((l,i)=>{g.fillStyle=i?(ser.filter(s=>!s.hide)[i-1].color):'#aaa';g.fillText(l,bx+8,m.t+12+i*15);});}
  };
  draw(null);
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),f=(e.clientX-r.left-m.l)/(r.width-m.l-m.r);if(f<0||f>1)return draw(null);draw(Math.round(f*(X.length-1)));};

}
function scatter(id,pts,xl,yl){
  const cv=document.getElementById(id);if(!cv)return;
  const {g,w,h}=prep(cv),m={l:52,r:12,t:8,b:30},pw=w-m.l-m.r,ph=h-m.t-m.b;
  let lo=Infinity,up=-Infinity;pts.forEach(p=>{lo=Math.min(lo,p.x,p.y);up=Math.max(up,p.x,p.y);});const pad=(up-lo||1)*.08;lo-=pad;up+=pad;
  const px=v=>m.l+(v-lo)/(up-lo)*pw,py=v=>m.t+(1-(v-lo)/(up-lo))*ph;
  g.font='10px "Space Mono",monospace';g.fillStyle='#6a6a6a';g.strokeStyle='rgba(255,255,255,.06)';
  ticks(lo,up,5).forEach(t=>{g.beginPath();g.moveTo(m.l,py(t));g.lineTo(w-m.r,py(t));g.stroke();g.beginPath();g.moveTo(px(t),m.t);g.lineTo(px(t),h-m.b);g.stroke();
    g.textAlign='right';g.textBaseline='middle';g.fillText(tf(t),m.l-7,py(t));g.textAlign='center';g.textBaseline='top';g.fillText(tf(t),px(t),h-m.b+7);});
  g.strokeStyle='rgba(255,255,255,.35)';g.setLineDash([5,4]);g.beginPath();g.moveTo(px(lo),py(lo));g.lineTo(px(up),py(up));g.stroke();g.setLineDash([]);
  pts.forEach(p=>{g.fillStyle=p.c;g.globalAlpha=.75;g.beginPath();g.arc(px(p.x),py(p.y),p.r||3,0,7);g.fill();});g.globalAlpha=1;
  g.fillStyle='#777';g.textAlign='right';g.textBaseline='bottom';g.fillText(xl,w-m.r,h-1);
  g.save();g.translate(11,m.t+ph/2);g.rotate(-Math.PI/2);g.textAlign='center';g.textBaseline='top';g.fillText(yl,0,0);g.restore();
}

  const truth=g('truth',c.truth),raw=g('raw',c.raw),fused=g('fused',c.fused),sg=g('sigma',c.fused);
  const band=fused&&sg?{lo:fused.map((v,i)=>v-2*sg[i]),hi:fused.map((v,i)=>v+2*sg[i]),on:S.vis.band}:null;
  return {t:ts.t,unit:c.unit,truth,raw,fused,band};}

    if(rows.length)scatter('cv-scatter',rows.map(r=>({x:r.y_ref,y:r.comfort_pred,c:r.supported?'#E84045':'#8d8d8d',r:r.scenario_id===curId()?6:3})),'reference y (m/s²)','predicted (m/s²)');}
  if(S.page==='validation'&&S.summary&&(S.summary.dropout_sweep||[]).length){const sw=[...S.summary.dropout_sweep].sort((a,b)=>a.dropout_pct-b.dropout_pct),cols={susp_travel_m:'#E84045',body_vel_mps:'#ffffff',wheel_vel_mps:'#9a9a9a',road_height_m:'#f5b942'};
    lineChart('cv-sweep',{x:sw.map(s=>s.dropout_pct),xlab:'sensor dropout (%)',ylab:'fused RMSE (SI units)',series:Object.entries(cols).map(([k,c])=>({y:sw.map(s=>s.fused_rmse&&num(s.fused_rmse[k])?s.fused_rmse[k]:null),color:c,w:2,label:k.replace(/_(m|mps)$/,'')}))});}
}
function renderRail(){
  $('#nav').innerHTML=PAGES.map(([k,t,d],i)=>`<button data-page="${k}" class="${S.page===k?'on':''}"><i>0${i+1}</i><span>${t}</span><em>${d}</em></button>`).join('');
  const av=(key,def)=>{const s=[...new Set(S.parsed.map(p=>p[key]))].sort((a,b)=>a>b?1:-1);return s.length?s:def;};
  const mk=(el,key,def,fmtv)=>{const vals=av(key,def);$(el).innerHTML=vals.map(v=>`<button class="chip ${S.sel[el==='#c-cls'?'cls':el==='#c-c'?'c':'d']===v?'on':''} ${S.parsed.length?'':'dis'}" data-sel="${key}" data-val="${v}">${fmtv?fmtv(v):v}</button>`).join('');};
  mk('#c-cls','cls',['A','B','C']);mk('#c-c','c',[1000,1800,3000]);mk('#c-d','d',[0,5,20],v=>v+'%');
  $('#fixed').innerHTML=S.parsed.length?`stored runs are fixed at<br><b>speed</b> ${S.fixed.v} m/s · <b>mass</b> ${S.fixed.m} kg<br><b>seed</b> ${S.fixed.s} · use “Run live” for others`:'no stored runs found';
  const id=S.live?'live run':curId();$('#sid').innerHTML=id?`<b>${esc(id)}</b>`:'no scenario';
}
function renderAll(){
  renderRail();$('#stage').innerHTML=P[S.page]();
  const any=[S.ts,S.summary,S.comfort,S.envelope,S.semi,S.meta];$('#badge').innerHTML=badgeFor(any);
  requestAnimationFrame(drawCharts);
}

/* ================= events ================= */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-page],[data-sel],[data-ch],[data-vis],#runlive,#backstored,#refresh,#exit');if(!t)return;
  if(t.dataset.page){S.page=t.dataset.page;renderAll();}
  else if(t.dataset.sel){const k=t.dataset.sel,v=k==='cls'?t.dataset.val:+t.dataset.val,key=k;S.sel[key]=v;
    if(!curId()){const alt=S.parsed.find(p=>p[key]===v);if(alt)S.sel={cls:alt.cls,c:alt.c,d:alt.d};}await loadTs();renderAll();}
  else if(t.dataset.ch){S.ch=t.dataset.ch;renderAll();}
  else if(t.dataset.vis){S.vis[t.dataset.vis]=!S.vis[t.dataset.vis];renderAll();}
  else if(t.id==='refresh')loadAll();
  else if(t.id==='backstored'){await loadTs();S.liveMsg='';renderAll();}
  else if(t.id==='exit'){const b=qs.get('back');if(b)location.href=b;else if(document.referrer)location.href=document.referrer;else history.back();}
  else if(t.id==='runlive'){
    const f={road_class:$('#f-cls').value,speed_mps:+$('#f-v').value,ms_kg:+$('#f-m').value,c_nsm:+$('#f-c').value,dropout_pct:+$('#f-d').value,seed:Math.max(0,Math.floor(+$('#f-s').value)),duration_s:+$('#f-t').value};
    S.liveForm=f;const bad=!(f.speed_mps>0)?'speed must be > 0':!(f.ms_kg>=100&&f.ms_kg<=1500)?'mass must be 100–1500 kg':!(f.c_nsm>0)?'damping must be > 0':!(f.dropout_pct>=0&&f.dropout_pct<=50)?'dropout must be 0–50 %':!(f.duration_s>=5&&f.duration_s<=60)?'duration must be 5–60 s':'';
    if(bad){S.liveMsg='!'+bad;return renderAll();}
    S.liveMsg='running…';renderAll();
    try{const r=await fetch(API+'/fusion/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)});const j=await r.json();
      if(!r.ok){S.liveMsg='!'+(j.error||('error '+r.status));}else{S.ts=j;S.live=true;S.liveMsg='done';}}
    catch(err){S.liveMsg='!backend not reachable';}renderAll();
  }
});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const i=+e.key;if(i>=1&&i<=PAGES.length){S.page=PAGES[i-1][0];renderAll();}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawCharts,120);});
loadAll();
</script>
</body>
