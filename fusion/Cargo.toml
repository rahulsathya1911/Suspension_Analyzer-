[package]
name = "suspension_fusion"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fusion_cli"
path = "src/bin/fusion_cli.rs"

[dependencies]
suspension_core = { path = "../core", package = "core" }
nalgebra = "0.33"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
toml = "0.8"

[dev-dependencies]
approx = "0.5"

